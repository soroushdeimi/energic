repos:
  - repo: local
    hooks:
      - id: backend-ruff
        name: ruff (backend)
        entry: uv run --project backend --extra dev ruff check --fix
        files: ^backend/
        language: system
        pass_filenames: false
      - id: backend-mypy
        name: mypy (backend)
        entry: uv run --project backend --extra dev mypy
        files: ^backend/
        language: system
        pass_filenames: false
      - id: frontend-lint
        name: eslint (frontend)
        entry: pnpm --dir frontend lint
        files: ^frontend/
        language: system
        pass_filenames: false
      - id: frontend-typecheck
        name: tsc (frontend)
        entry: pnpm --dir frontend typecheck
        files: ^frontend/
        language: system
        pass_filenames: false
      - id: frontend-format
        name: prettier (frontend)
        entry: pnpm --dir frontend format:check
        files: ^frontend/
        language: system
        pass_filenames: false
