[mypy]
python_version = 3.12
strict = True
plugins =
    mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = config.settings.dev

# django-stubs marks ModelAdmin/Inline as generic but Django's runtime classes
# are not subscriptable, so type-arg cannot be satisfied for admin modules.
[mypy-core.admin]
disallow_any_generics = False
warn_return_any = False
