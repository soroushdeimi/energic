[project]
name = "energic-backend"
version = "0.1.0"
description = "Energic Innovation Center - Django backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<5.1",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "django-environ>=0.11",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "django-stubs>=4.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.per-file-ignores]
"core/migrations/*" = ["E501"]
"core/management/commands/seed_from_archive.py" = ["E501"]

[dependency-groups]
dev = [
    "djangorestframework-stubs>=3.18.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["core"]
